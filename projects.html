<script>
function toggleMusic() {
    const song = document.getElementById("mySong");
    const button = document.getElementById("musicBtn");

    if (song.paused) {
        song.play();
        button.innerHTML = "⏸";
    } else {
        song.pause();
        button.innerHTML = "▶";
    }
}
</script>
